<!-- memberDashboard.html
     Experience Cloud member home page component.
     Shows tier badge, points balance, tier progress,
     vouchers, recent transactions, and active promotions.
     API v62.0 — uses lwc:if / lwc:else (not if:true).
-->
<template>
    <div class="member-dashboard">

        <!-- ── Loading skeleton ─────────────────────────────── -->
        <lwc:if isTrue={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner
                    alternative-text="Loading member data"
                    size="medium"
                    variant="brand">
                </lightning-spinner>
            </div>
        </lwc:if>

        <!-- ── Error banner ─────────────────────────────────── -->
        <lwc:if isTrue={hasError}>
            <div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium"
                 role="alert">
                <span class="slds-assistive-text">Error</span>
                <lightning-icon
                    icon-name="utility:error"
                    alternative-text="Error"
                    size="x-small"
                    class="slds-m-right_x-small">
                </lightning-icon>
                {errorMessage}
                <button class="slds-button slds-button_neutral slds-m-left_small"
                        onclick={handleRetry}>Retry</button>
            </div>
        </lwc:if>

        <!-- ── Main content (loaded) ────────────────────────── -->
        <lwc:if isTrue={isLoaded}>

            <!-- Hero Section -->
            <div class={heroCssClass}>
                <div class="slds-grid slds-grid_align-spread slds-wrap">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                        <p class="member-greeting">Welcome back,</p>
                        <h1 class="member-name">{memberData.memberName}</h1>
                        <p class="member-number">Member #{memberData.memberNumber}</p>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3
                                slds-align_absolute-center">
                        <div class={tierBadgeCssClass}>
                            <span class="tier-icon">{tierIcon}</span>
                            <span class="tier-label">{memberData.currentTier}</span>
                        </div>
                    </div>
                </div>

                <!-- Points Balance -->
                <div class="points-balance-section slds-m-top_medium">
                    <div class="points-display">
                        <span class="points-number">{formattedPointsBalance}</span>
                        <span class="points-label">BeautyPoints</span>
                    </div>
                    <lwc:if isTrue={hasBonusPoints}>
                        <p class="bonus-points-label">
                            + {formattedBonusPoints} bonus points
                        </p>
                    </lwc:if>
                </div>

                <!-- Tier Progress Bar -->
                <lwc:if isTrue={showTierProgress}>
                    <div class="tier-progress-section slds-m-top_medium">
                        <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                            <span class="progress-tier-label">{memberData.currentTier}</span>
                            <span class="progress-tier-label">{memberData.nextTierName}</span>
                        </div>
                        <lightning-progress-bar
                            value={memberData.tierProgress}
                            size="large"
                            variant="base">
                        </lightning-progress-bar>
                        <p class="progress-label slds-m-top_x-small">
                            {formattedPointsToNextTier} points to {memberData.nextTierName}
                        </p>
                    </div>
                </lwc:if>
            </div>

            <!-- Quick Actions -->
            <div class="slds-grid slds-gutters slds-m-top_medium quick-actions-row">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button
                        label="Redeem Points"
                        variant="brand"
                        icon-name="utility:gift_card"
                        onclick={handleOpenRedemptionWizard}
                        class="slds-size_1-of-1">
                    </lightning-button>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-button
                        label={transactionToggleLabel}
                        variant="neutral"
                        icon-name="utility:list"
                        onclick={handleToggleTransactions}
                        class="slds-size_1-of-1">
                    </lightning-button>
                </div>
            </div>

            <!-- Active Promotions (promotionBanner sub-component) -->
            <div class="slds-m-top_large">
                <h2 class="section-title">Active Promotions</h2>
                <c-promotion-banner member-id={memberId}></c-promotion-banner>
            </div>

            <!-- Active Vouchers -->
            <lwc:if isTrue={hasActiveVouchers}>
                <div class="slds-m-top_large">
                    <h2 class="section-title">Your Vouchers</h2>
                    <div class="slds-grid slds-gutters slds-wrap">
                        <template for:each={memberData.activeVouchers} for:item="voucher">
                            <div key={voucher.voucherId}
                                 class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2
                                        slds-large-size_1-of-3 slds-m-bottom_small">
                                <div class="voucher-card">
                                    <div class="voucher-header">
                                        <span class="voucher-type">{voucher.rewardType}</span>
                                        <span class={getVoucherStatusCss(voucher.status)}>
                                            {voucher.status}
                                        </span>
                                    </div>
                                    <div class="voucher-value">
                                        ${voucher.discountValue} off
                                    </div>
                                    <div class="voucher-code">
                                        <span class="code-label">Code:</span>
                                        <span class="code-value">{voucher.redemptionCode}</span>
                                        <button class="slds-button slds-button_icon"
                                                data-code={voucher.redemptionCode}
                                                onclick={handleCopyCode}
                                                title="Copy code">
                                            <lightning-icon
                                                icon-name="utility:copy"
                                                size="x-small">
                                            </lightning-icon>
                                        </button>
                                    </div>
                                    <p class="voucher-expiry">
                                        Expires: {formatDate(voucher.expiryDate)}
                                    </p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </lwc:if>

            <!-- Recent Transactions (toggle) -->
            <lwc:if isTrue={showTransactions}>
                <div class="slds-m-top_large">
                    <h2 class="section-title">Recent Transactions</h2>
                    <lwc:if isTrue={hasTransactions}>
                        <div class="transaction-list">
                            <template for:each={memberData.recentTransactions}
                                      for:item="txn">
                                <div key={txn.transactionId} class="transaction-row">
                                    <div class="slds-grid slds-grid_align-spread">
                                        <div class="slds-col">
                                            <lightning-icon
                                                icon-name={getChannelIcon(txn.sourceChannel)}
                                                size="x-small"
                                                class="slds-m-right_x-small channel-icon">
                                            </lightning-icon>
                                            <span class="txn-description">
                                                {txn.description}
                                            </span>
                                            <br/>
                                            <span class="txn-date">{txn.transactionDate}</span>
                                        </div>
                                        <div class="slds-col slds-no-flex">
                                            <span class={getPointsCss(txn.transactionType)}>
                                                {formatPoints(txn.totalPoints, txn.transactionType)}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </lwc:if>
                    <lwc:else>
                        <p class="slds-text-color_weak slds-p-around_medium">
                            No recent transactions found.
                        </p>
                    </lwc:else>
                </div>
            </lwc:if>

        </lwc:if>

        <!-- Redemption Wizard Modal -->
        <lwc:if isTrue={showRedemptionWizard}>
            <c-points-redemption-wizard
                member-id={memberId}
                points-balance={memberData.pointsBalance}
                current-tier={memberData.currentTier}
                onclose={handleWizardClose}
                onredemptionsuccess={handleRedemptionSuccess}>
            </c-points-redemption-wizard>
        </lwc:if>

    </div>
</template>
